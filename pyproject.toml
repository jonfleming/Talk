[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "talk"
version = "0.1.0"
description = "Local Windows dictation daemon for the Talk desktop app"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"faster-whisper>=1.1.1",
	"numpy>=2.2.5",
	"sounddevice>=0.5.2",
	"websockets>=15.0.1",
]

[project.scripts]
talk-daemon = "talk_daemon.server:main"

[tool.hatch.build.targets.wheel]
packages = ["talk_daemon"]

[tool.hatch.build.targets.sdist]
include = [
	"/talk_daemon",
	"/main.py",
	"/README.md",
]
